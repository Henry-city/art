<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhyArt · Production</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="production.css"><script type="module" src="vendor/model-viewer.min.js"></script></head>
<body class="static-preview"><header><a class="brand" href="index.html"><span class="mark">P</span> PhyArt</a><nav><a href="index.html">Gallery</a><a href="source-data.html">Source Data</a><a href="production.html" aria-current="page">Production</a><a href="./simulation.html">Simulation</a></nav><span class="private">● 资产预览</span></header>
<main><div class="heading"><div><p class="eyebrow">ASSET WORKSPACE</p><h1>Production</h1></div><div id="connection" role="status">正在连接工作台…</div></div>
<section class="overview"><div class="summary panel"><div class="section-label">资产总数 <span id="target">/ 1100</span></div><div class="total" id="total">0</div><div class="progress"><i id="progress"></i></div><div class="summary-foot"><span id="review-count">待验收</span><span id="percent">0%</span></div></div><div class="distribution panel"><div class="ring" id="ring"><div><strong id="ring-total">0</strong><span>已生成</span></div></div><div id="legend" class="legend"></div></div><div class="pipeline panel"><div class="section-label">工作流</div><div id="queues"></div></div></section>
<section class="assets-section"><div class="toolbar"><div class="filters" role="group" aria-label="资产类别"><button class="active" data-category="all">全部</button><button data-category="cabinet">Cabinet</button><button data-category="microwave">Microwave</button><button data-category="toilet">Toilet</button></div><div class="tools"><select id="batch" aria-label="批次"><option value="all">所有批次</option></select><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索编号、结构或外观" aria-label="搜索资产"></label></div></div><div class="list-heading"><span id="result-count">0 个资产</span><span>Blender · GLB · USD</span></div><div id="grid" class="grid"></div><div id="empty" class="empty">生成完成并通过几何检查后，资产会自动出现在这里。</div><div class="pagination"><button id="prev">← 上一页</button><span id="page-number">1 / 1</span><button id="next">下一页 →</button></div></section>
<details class="diagnostics"><summary>运行记录 <span id="failure-count"></span></summary><div id="running"></div><div id="failures"></div></details>
</main><footer><span>PhyArt</span><span id="updated">自动更新 · 每 5 秒</span></footer>
<dialog id="detail"><div class="dialog-head"><div><p class="eyebrow" id="detail-category"></p><h2 id="detail-title"></h2></div><button id="close" aria-label="关闭预览">✕</button></div><div class="tabs"><button data-tab="images" class="active">渲染预览</button><button data-tab="model">3D · 开合动画</button></div><div id="images" class="preview-pair"></div><div id="model" hidden><model-viewer id="viewer" camera-controls autoplay shadow-intensity="1" environment-image="neutral" exposure="1" interaction-prompt="none" alt="资产三维模型"></model-viewer><div class="model-controls"><button id="play">暂停动画</button><button id="reset-view">重置视角</button></div><p id="model-status" role="status"></p></div><div id="metadata" class="metadata"></div><div id="downloads" class="downloads"></div></dialog>
<script>window.PHYART_STATIC=true</script><script src="production.js"></script></body></html>
